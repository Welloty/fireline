                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"

                    <svg class="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"

                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />

                    <span data-i18n="download-btn">СКАЧАТЬ</span>

        <!-- Мобильное меню -->

            <a href="./" class="mobile-nav-item">

    <main>
        <div class="wrapper">
            <div class="page-header">
                <div class="section-tag">FIRELINE</div>
                <h1 data-i18n="page-title">НОВОСТИ</h1>
            </div>

            <div class="news-grid" id="news-grid">
                <div class="news-loading">
                    <div class="spinner"></div>
                    <p>Загрузка новостей…</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-logo">
                <img src="../fireline.avif" alt="" class="logo-img-mini" onerror="this.style.display='none'">
                <span>Fireline</span>
            </div>
            <p data-i18n="footer">© 2026 vertexgames. Все права защищены.</p>
            <a href="https://t.me/fireline_2d" target="_blank" rel="noopener noreferrer"
                class="footer-link">Telegram</a>
        </div>
    </footer>

    <!-- Модальное окно настроек -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h2 data-i18n="settings-title">Настройки интерфейса</h2>
                <button id="modal-close" class="modal-close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="settings-section">
                    <h3 data-i18n="theme-title">Цветовая схема</h3>
                    <div class="theme-selector">
                        <button class="theme-opt" data-theme="dark" data-i18n="theme-dark">Тёмная</button>
                        <button class="theme-opt" data-theme="black" data-i18n="theme-black">Чёрная</button>
                        <button class="theme-opt" data-theme="light" data-i18n="theme-light">Светлая</button>
                    </div>
                </div>
                <div class="settings-section">
                    <h3 data-i18n="lang-title">Язык интерфейса</h3>
                    <div class="lang-selector">
                        <button class="lang-opt" data-lang="ru">Русский</button>
                        <button class="lang-opt" data-lang="ua">Українська</button>
                        <button class="lang-opt" data-lang="en">English</button>
                    </div>
                </div>
            </div>
